# Pods that do nothing and ask for almost nothing, so the only thing they use up is IP addresses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pause
  namespace: default
  labels:
    app: pause
spec:
  replicas: 0
  selector:
    matchLabels:
      app: pause
  template:
    metadata:
      labels:
        app: pause
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
